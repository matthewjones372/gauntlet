# Publishes a release when a v* tag is pushed: the three binaries and
# checksums.txt, after each binary passes the smoke test on its own platform.
# `gauntlet connect github` installs gauntlet-linux-x64 from here and checks
# it against checksums.txt (or a pinned sha256).

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: The tag must match the version compiled in
        run: |
          version=$(sed -n 's/.*GAUNTLET_VERSION = "\(.*\)".*/\1/p' packages/cli/src/version.ts)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME doesn't match version $version"; exit 1; }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
        env:
          CI: "true"
      - run: bun run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest }
          - { target: darwin-arm64, os: macos-latest }
          # GitHub's Intel macOS runner (until August 2027), not Rosetta on Apple Silicon.
          - { target: darwin-x64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist/
      - run: cd dist && shasum -a 256 -c checksums.txt
      - run: chmod +x dist/gauntlet-${{ matrix.target }}
      - run: bun scripts/smoke.ts dist/gauntlet-${{ matrix.target }}

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a suffix (v0.1.0-rc.1) is published as a prerelease.
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/gauntlet-* dist/checksums.txt --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
