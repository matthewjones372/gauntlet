# Generated by `gauntlet connect github`. Single-repository mode.
# Every pull request is judged by the policy, baseline and protected files of
# its base commit (ADR 0003). The evidence job runs the pull request's code with
# a read-only token and no secrets. The status job never runs pull request code:
# it recomputes everything that needs no execution itself (policy, diff facts,
# protected changes, integrity findings), takes only test and tool outcomes from
# the evidence job, and posts the report and the required `gauntlet` check.

name: gauntlet

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited]

permissions: {}

concurrency:
  group: gauntlet-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  evidence:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out the change, without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Check out Gauntlet's source at the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .gauntlet-source
          persist-credentials: false
      - name: Build Gauntlet from the base commit
        run: |
          cd .gauntlet-source
          bun install --frozen-lockfile
          bun build --compile packages/cli/src/main.ts --outfile "$RUNNER_TEMP/gauntlet"
          cd ..
          rm -rf .gauntlet-source
      - name: Check the change with the base commit's policy
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gauntlet" check --policy-ref "$BASE" --head "$HEAD" --out gauntlet-out --no-record || true
          # When the change edits .gauntlet/, prove the proposed policy still catches tampering.
          if ! git diff --quiet "$BASE" "$HEAD" -- .gauntlet; then
            "$RUNNER_TEMP/gauntlet" selftest --base "$HEAD" --json > gauntlet-out/selftest.json || true
          fi
      - name: Keep the evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gauntlet-evidence
          path: gauntlet-out
          retention-days: 30

  status:
    needs: [evidence]
    # Runs again when an owner comments `/gauntlet approve <commit>` or ticks the box in Gauntlet's report
    # (an author can't approve their own pull request).
    if: always() && (github.event_name != 'issue_comment' || (github.event.issue.pull_request && (startsWith(github.event.comment.body, '/gauntlet approve') || (github.event.action == 'edited' && startsWith(github.event.comment.body, '<!-- gauntlet-report -->') && contains(github.event.comment.body, '- [x] **Approve this change**')))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      checks: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      # On a comment the event names no commits: this checks out and builds the default branch, which is trusted too.
      - name: Check out the base (trusted code only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Check out Gauntlet's source at the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .gauntlet-source
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Build Gauntlet from the base commit
        run: |
          cd .gauntlet-source
          bun install --frozen-lockfile
          bun build --compile packages/cli/src/main.ts --outfile "$RUNNER_TEMP/gauntlet"
          cd ..
          rm -rf .gauntlet-source
      - name: Find the pull request's commits (a comment event doesn't carry them)
        if: github.event_name == 'issue_comment'
        run: gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefOid,headRefOid --jq '"BASE=\(.baseRefOid)\nHEAD=\(.headRefOid)"' >> "$GITHUB_ENV"
      - name: Fetch the change's commits and Gauntlet's notes (nothing is run)
        run: |
          git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pr/head"
          git fetch --no-tags origin "+refs/notes/gauntlet:refs/notes/gauntlet" "+refs/notes/gauntlet-overrides:refs/notes/gauntlet-overrides" || true
      - name: Find the evidence for this commit
        run: |
          if [ "${{ github.event_name }}" != "pull_request_target" ]; then
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "${{ github.workflow }}" --commit "$HEAD" --event pull_request_target --status completed --limit 1 --json databaseId --jq '.[0].databaseId')
          else
            run_id="${{ github.run_id }}"
          fi
          mkdir -p evidence
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name gauntlet-evidence --dir evidence || true
      - name: Fetch reviews and owner team members
        env:
          TEAMS_TOKEN: ${{ secrets.GAUNTLET_TEAMS_TOKEN }}
          TICKED_BY: ${{ github.event.sender.login }}
          TICKED_BODY: ${{ github.event.comment.body }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --jq '.[] | {user: .user.login, state: .state, commitId: .commit_id}' | jq -s . > reviews.json
          # Each comment with its last editor: anyone with write access can edit any comment, so its text counts as the editor's.
          gh api graphql --paginate -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F number="$PR" \
            -f query='query($owner: String!, $name: String!, $number: Int!, $endCursor: String) { repository(owner: $owner, name: $name) { pullRequest(number: $number) { comments(first: 100, after: $endCursor) { pageInfo { hasNextPage endCursor } nodes { body author { __typename login } editor { __typename login } } } } } }' \
            --jq 'def who: if .__typename == "Bot" then .login + "[bot]" else .login end; .data.repository.pullRequest.comments.nodes[] | {user: ((.author // {login: "ghost"}) | who), body: .body} + (if .editor then {editor: (.editor | who)} else {} end)' | jq -s . > comments.json
          # A ticked box in Gauntlet's report counts as from whoever ticked it; only an owner's counts.
          if [ "${{ github.event_name }}" = "issue_comment" ] && [ "${{ github.event.action }}" = "edited" ]; then
            jq --arg u "$TICKED_BY" --arg b "$TICKED_BODY" '. + [{user: $u, body: $b}]' comments.json > comments.next && mv comments.next comments.json
          fi
          echo '{}' > teams.json
          # Team owners can only be checked with a token that may read org teams.
          if [ -n "$TEAMS_TOKEN" ]; then
            for team in $("$RUNNER_TEMP/gauntlet" explain --ir --repo . | jq -r '[.ir.owners[], .ir.zones[].owners[]] | unique[] | select(contains("/"))'); do
              org="${team#@}"; slug="${org#*/}"; org="${org%%/*}"
              members=$(GH_TOKEN="$TEAMS_TOKEN" gh api --paginate "orgs/$org/teams/$slug/members" --jq '.[].login' | jq -R . | jq -s .)
              jq --arg t "$team" --argjson m "$members" '. + {($t): $m}' teams.json > teams.next && mv teams.next teams.json
            done
          fi
      - name: Find the pull request's stack
        run: |
          # Pull requests based on each other form a stack. Below: follow the bases down to the default branch.
          # Above: the pull requests based on this one, and theirs, each with its comments and whether its
          # commit contains this one (git decides that, not GitHub's bases).
          comments_of() {
            gh api graphql --paginate -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F number="$1" \
              -f query='query($owner: String!, $name: String!, $number: Int!, $endCursor: String) { repository(owner: $owner, name: $name) { pullRequest(number: $number) { comments(first: 100, after: $endCursor) { pageInfo { hasNextPage endCursor } nodes { body author { __typename login } editor { __typename login } } } } } }' \
              --jq 'def who: if .__typename == "Bot" then .login + "[bot]" else .login end; .data.repository.pullRequest.comments.nodes[] | {user: ((.author // {login: "ghost"}) | who), body: .body} + (if .editor then {editor: (.editor | who)} else {} end)' | jq -s .
          }
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,headRefName,baseRefName,headRefOid > prs.json
          below='[]'
          ref=$(jq -r --argjson n "$PR" '.[] | select(.number == $n) | .baseRefName' prs.json)
          for _ in $(seq 1 20); do
            n=$(jq -r --arg r "$ref" '[.[] | select(.headRefName == $r)][0].number // empty' prs.json)
            [ -z "$n" ] && break
            below=$(jq -c --argjson n "$n" '[$n] + .' <<< "$below")
            ref=$(jq -r --argjson n "$n" '.[] | select(.number == $n) | .baseRefName' prs.json)
          done
          above='[]'
          queue=$(jq -r --argjson n "$PR" '.[] | select(.number == $n) | .headRefName' prs.json)
          for _ in $(seq 1 20); do
            [ -z "$queue" ] && break
            next=""
            for ref in $queue; do
              for n in $(jq -r --arg r "$ref" '.[] | select(.baseRefName == $r) | .number' prs.json); do
                sha=$(jq -r --argjson n "$n" '.[] | select(.number == $n) | .headRefOid' prs.json)
                git fetch --no-tags origin "+refs/pull/$n/head:refs/remotes/pr/$n" > /dev/null 2>&1 || true
                if git merge-base --is-ancestor "$HEAD" "$sha" 2> /dev/null; then contains=true; else contains=false; fi
                above=$(jq -c --argjson n "$n" --arg h "$sha" --argjson c "$contains" --argjson m "$(comments_of "$n")" '. + [{number: $n, head: $h, contains: $c, comments: $m}]' <<< "$above")
                next="$next $(jq -r --argjson n "$n" '.[] | select(.number == $n) | .headRefName' prs.json)"
              done
            done
            queue="$next"
          done
          jq -n --argjson b "$below" --argjson a "$above" '{below: $b, above: $a}' > stack.json
      - name: Decide
        run: |
          "$RUNNER_TEMP/gauntlet" github-status --repo . --policy-ref "$BASE" --head "$HEAD" \
            --evidence evidence/gauntlet-report.json --reviews reviews.json --teams teams.json --comments comments.json --stack stack.json --out gauntlet-out --record
      - name: Post the report and the check
        run: |
          body=$(printf '<!-- gauntlet-report -->\n%s' "$(cat gauntlet-out/gauntlet-report.md)")
          comment=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- gauntlet-report -->")) | .id' | head -n 1)
          if [ -n "$comment" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name=gauntlet -f head_sha="$HEAD" -f status=completed \
            -f conclusion="$(jq -r .conclusion gauntlet-out/status.json)" \
            -f "output[title]=$(jq -r .title gauntlet-out/status.json)" \
            -f "output[summary]=$(jq -r .summary gauntlet-out/status.json)" > /dev/null
      - name: Approve the pull requests under it
        run: |
          # Approved at the top of a stack: the commit approved contains every pull request under it, and this
          # report's owners include theirs, so each one only waiting for an approval is approved too.
          [ "$(jq -r .conclusion gauntlet-out/status.json)" = success ] || exit 0
          by=$(jq -r '.approvedBy | join(", ")' gauntlet-out/status.json)
          for n in $(jq -r '.below[]' stack.json); do
            sha=$(jq -r --argjson n "$n" '.[] | select(.number == $n) | .headRefOid' prs.json)
            git merge-base --is-ancestor "$sha" "$HEAD" 2> /dev/null || continue
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=gauntlet" --jq '.check_runs[0].conclusion // empty')
            [ "$state" = action_required ] || continue
            gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" -f name=gauntlet -f head_sha="$sha" -f status=completed -f conclusion=success \
              -f "output[title]=Approved with its stack by $by (#$PR)" \
              -f "output[summary]=Approved with its stack: the box was ticked on #$PR by $by, and #$PR's commit contains this one." > /dev/null
            comment=$(gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments" --paginate --jq '.[] | select(.body | startswith("<!-- gauntlet-report -->")) | .id' | head -n 1)
            [ -z "$comment" ] && continue
            body=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment" --jq .body | awk -v note="**Approved with its stack** by $by: the box was ticked on #$PR, whose commit contains this one." 'NR == 2 { print ""; print note } { print }')
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -f body="$body" > /dev/null
          done
      - name: Push Gauntlet's shadow history
        if: github.event_name == 'pull_request_target'
        run: git push origin refs/notes/gauntlet || true
