# Gauntlet's own build: typecheck and tests on every push and pull request,
# the real-tool end-to-end suites (one parallel job per language), and the compiled binary
# for each release target, smoke-tested on that platform. Judging pull
# requests against the policy is a separate workflow (gauntlet.yml).

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
        env:
          CI: "true"

  # One job per language pack, in parallel: each installs only its own tools,
  # and a slow pack (sbt) no longer pushes the rest past the time limit.
  e2e:
    name: e2e (${{ matrix.pack }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pack: [jvm, typescript, python, go, rust, scala, clojure]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - if: contains(fromJSON('["jvm", "scala", "clojure"]'), matrix.pack)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - if: matrix.pack == 'jvm'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - if: matrix.pack == 'python'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - if: matrix.pack == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: examples/fixtures/go-service/go.mod
          cache: false
      - if: matrix.pack == 'go'
        name: Install the Go tools the Go pack gates with
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - if: matrix.pack == 'rust'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, llvm-tools-preview
      - if: matrix.pack == 'rust'
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-mutants
      - if: matrix.pack == 'scala'
        uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1.5.11
      - if: matrix.pack == 'clojure'
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: "1.12.6.1673"
          lein: "2.12.0"
          clj-kondo: "2026.08.04"
      - run: bun install --frozen-lockfile
      - name: End-to-end suite against real ${{ matrix.pack }} projects
        run: bun test packs/${{ matrix.pack }}
        env:
          CI: "true"
          GAUNTLET_E2E: "1"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest }
          - { target: darwin-arm64, os: macos-latest }
          - { target: darwin-x64, os: macos-latest, rosetta: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist/
      - name: Install Rosetta for the x64 binary
        if: matrix.rosetta
        run: softwareupdate --install-rosetta --agree-to-license
      - name: Check the downloaded binaries against their checksums
        run: cd dist && shasum -a 256 -c checksums.txt
      - run: chmod +x dist/gauntlet-${{ matrix.target }}
      - run: bun scripts/smoke.ts dist/gauntlet-${{ matrix.target }}
