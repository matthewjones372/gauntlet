[project]
name = "py-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "coverage==7.16.2",
  "hypothesis==6.168.5",
  "mutmut==3.8.0",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.mutmut]
source_paths = ["src/"]
tests_dir = ["tests/"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B"]
